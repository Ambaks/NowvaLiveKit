[project]
name = "biomechanics"
version = "0.1.0"
description = "Real-time biomechanics coaching pipeline for squat analysis"
requires-python = ">=3.11"
dependencies = [
    # Core
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",

    # Layer 1: Pose Estimation
    "onnxruntime>=1.17",
    "mediapipe>=0.10.9",

    # Layer 4: Fault Detection
    "torch>=2.2",
    "torchvision>=0.17",

    # Layer 5: Coaching
    "anthropic>=0.40",
    "pyttsx3>=2.90",

    # Visualization
    "matplotlib>=3.8",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "websockets>=12.0",
    "jinja2>=3.1",

    # Utilities
    "rich>=13.7",
    "typer>=0.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.scripts]
biomechanics = "biomechanics.main:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["biomechanics*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
