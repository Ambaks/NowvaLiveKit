pipeline:
  target_fps: 30
  log_level: INFO
  single_camera_mode: true     # overridden by NOWVA_MULTI_CAMERA env var

capture:
  source: webcam
  device_id: 0
  resolution: [1280, 720]

pose:
  backend: mediapipe            # mediapipe | rtmpose
  confidence_threshold: 0.3
  model_complexity: 2           # 0=lite, 1=full, 2=heavy (mediapipe only)
  # model_path: src/biomechanics/pose/models/rtmpose-m-256x192.onnx  # uncomment for rtmpose

triangulation:
  enabled: false                # overridden by NOWVA_MULTI_CAMERA env var

kinematics:
  backend: analytical           # analytical | opensim

faults:
  depth:
    parallel: 90.0
    below_parallel: 100.0
  bilateral_asymmetry:
    mild: 8.0
    moderate: 13.0
    severe: 18.0
  heel_rise:
    threshold_deg: 20.0
  forward_lean:
    mild: 145.0
    moderate: 135.0
    severe: 125.0
  knee_valgus:
    mild: 8.0
    moderate: 13.0
    severe: 18.0

rep_detection:
  entry_threshold: 30.0
  min_rep_duration_frames: 20

coaching:
  min_cue_gap_seconds: 1.0
  set_timeout_seconds: 30.0     # Pause > this = new set
  cache_cues_before_set: true

ipc:
  frame_send_interval: 10       # Send frame data every N frames
  fault_cooldown_seconds: 3.0

velocity_clamp:
  max_velocity_m_per_s: 2.5

bone_constraints:
  calibration_frames: 30
  tolerance: 0.0

standing_gate:
  min_confidence: 0.5
  max_knee_flexion_deg: 20.0
  max_trunk_flexion_deg: 25.0
  min_torso_length_m: 0.25
  max_torso_length_m: 0.80
  required_consecutive_frames: 5

confidence_blend:
  min_confidence: 0.1
  max_confidence: 0.9

predictive_state:
  horizon_seconds: 0.2
  max_extrapolation_deg: 15.0

bilstm:
  enabled: true
  model_path: models/bilstm_rep_counter.pt
  device: cpu
  num_classes: 5
  min_depth_class: 3              # 0=standing, 1=quarter, 2=half, 3=parallel, 4=deep
  min_rep_frames: 12
  ema_alpha: 0.2

hip_counter:
  entry_vel_threshold: 3.0        # cm/s — triggers STANDING→DESCENDING
  bottom_vel_threshold: 5.0       # cm/s — abs(vel) below this = at bottom
  ascending_vel_threshold: 3.0    # cm/s — vel < -this = BOTTOM→ASCENDING
  min_depth_cm: 10.0              # minimum displacement for valid rep (like prominence)
  standing_return_cm: 3.0         # must return within this of baseline to complete rep
  min_frames_descending: 3
  min_frames_bottom: 2
  min_frames_ascending: 3
  min_rep_duration_frames: 15
  position_min_cutoff: 1.5        # One Euro filter smoothing
  position_beta: 0.01
  velocity_ema_alpha: 0.3
