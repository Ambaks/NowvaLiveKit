# Cause definitions for squat diagnosis hypothesis engine.
#
# Tiers:
#   0 = contextual (structural, informational only)
#   1 = immediate (cue-correctable within the same session)
#   2 = session-level (programming adjustment across sessions)
#   3 = long-term (mobility/strength work over weeks)

# ─── Tier 0: Contextual ───────────────────────────────────────────────

anthropometric_femur_torso_ratio:
  description: "Long femurs relative to torso biomechanically require more trunk lean"
  tier: 0
  evidence_test_fn: test_femur_torso_ratio
  parameter_delta_fn: null
  explanation_template: "Your femur-to-torso ratio ({ratio:.2f}) naturally requires ~{expected_lean:.0f}° of trunk lean — this is structural, not a fault."

# ─── Tier 1: Cue-correctable ──────────────────────────────────────────

narrow_stance:
  description: "Stance width is too narrow for the athlete's hip structure"
  tier: 1
  evidence_test_fn: test_narrow_stance
  parameter_delta_fn: delta_widen_stance
  explanation_template: "Stance width ratio is {current_ratio:.2f} — try widening to ~{recommended_ratio:.2f}× shoulder width."

narrow_foot_angle:
  description: "Feet are not turned out enough for the athlete's hip anatomy"
  tier: 1
  evidence_test_fn: test_narrow_foot_angle
  parameter_delta_fn: delta_widen_foot_angle
  explanation_template: "Foot direction is {current_angle:.0f}° — try turning out to ~{recommended_angle:.0f}°."

bracing_failure:
  description: "Insufficient intra-abdominal pressure / core bracing during the lift"
  tier: 1
  evidence_test_fn: test_bracing_failure
  parameter_delta_fn: delta_brace_trunk
  explanation_template: "Trunk collapses under load — brace harder before descent (big breath, push belly out)."

knee_track_cue:
  description: "Knees not actively pushed out to track over foot direction"
  tier: 1
  evidence_test_fn: test_knee_track_cue
  parameter_delta_fn: delta_knees_out
  explanation_template: "Cue: push your knees out toward your pinky toes throughout the lift."

weight_shift_cue:
  description: "Weight shifts to one side during descent"
  tier: 1
  evidence_test_fn: test_weight_shift
  parameter_delta_fn: delta_center_weight
  explanation_template: "Weight is shifting toward your {heavier_side} side — focus on even pressure through both feet."

depth_cue_unfamiliar:
  description: "Athlete is unfamiliar or hesitant at deeper positions"
  tier: 1
  evidence_test_fn: test_depth_unfamiliarity
  parameter_delta_fn: delta_increase_depth
  explanation_template: "You have the mobility for deeper squats — practice paused reps at parallel to build confidence."

# ─── Tier 2: Programming ────────��─────────────────────────────────────

weight_too_heavy:
  description: "Load exceeds the athlete's ability to maintain form across the set"
  tier: 2
  evidence_test_fn: test_progressive_degradation
  parameter_delta_fn: null
  explanation_template: "Form degrades from rep {first_bad_rep} onward — consider reducing load by ~{reduction_pct:.0f}%."

# ─── Tier 3: Mobility / Strength (long-term) ──���──────────────────────

limited_ankle_df:
  description: "Restricted ankle dorsiflexion range limiting squat mechanics"
  tier: 3
  evidence_test_fn: test_limited_ankle_df
  parameter_delta_fn: null
  explanation_template: "Ankle dorsiflexion is {current_df:.0f}° (need >{expected_df:.0f}°). Work on calf mobility or use heeled shoes."

limited_hip_flexion:
  description: "Restricted hip flexion mobility limiting depth and forcing trunk lean"
  tier: 3
  evidence_test_fn: test_limited_hip_flexion
  parameter_delta_fn: null
  explanation_template: "Hip flexion mobility is limiting your depth. Add 90-90 stretches and hip flexor work."

weak_hip_abductors:
  description: "Hip abductors unable to resist the valgus moment under load"
  tier: 3
  evidence_test_fn: test_weak_hip_abductors
  parameter_delta_fn: null
  explanation_template: "Knee cave suggests weak glute medius — add banded clamshells, lateral walks, and Copenhagen planks."

foot_collapse_arch:
  description: "Medial arch collapse driving knee valgus from the ground up"
  tier: 3
  evidence_test_fn: test_foot_arch_collapse
  parameter_delta_fn: null
  explanation_template: "Foot collapse is contributing to knee cave. Cue 'spread the floor' or switch to firmer-soled shoes."

unilateral_hip_mobility_limit:
  description: "One hip has significantly less mobility than the other"
  tier: 3
  evidence_test_fn: test_unilateral_hip
  parameter_delta_fn: null
  explanation_template: "Your {tighter_side} hip is more restricted — add unilateral pigeon stretches and 90-90 holds on that side."
